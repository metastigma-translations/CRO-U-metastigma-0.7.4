name: Debug UI string catalogs

on:
  pull_request:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Regenerate catalogs and show exact diff
        run: |
          python3 engine/tools/ui_strings.py
          git diff -- engine/lang > /tmp/ui-strings.diff
          if [ -s /tmp/ui-strings.diff ]; then
            cat /tmp/ui-strings.diff
          else
            echo "NO CATALOG DIFF"
          fi
