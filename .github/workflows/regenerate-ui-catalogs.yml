name: Regenerate UI string catalogs (temporary)

on:
  push:
    branches:
      - fix/title-menu-font-labels
    paths:
      - .github/workflows/regenerate-ui-catalogs.yml

permissions:
  contents: write
  actions: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/title-menu-font-labels
      - name: Run the repository's exact catalog generator
        run: |
          python3 engine/tools/ui_strings.py
          python3 engine/tools/ui_strings.py --check
      - name: Commit the generated catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/lang/template.pot engine/lang/*.po
          if git diff --cached --quiet; then
            echo "Catalogs already match the generator."
          else
            git commit -m "Regenerate UI gettext catalogs"
            git push origin HEAD:fix/title-menu-font-labels
          fi
      - name: Dispatch the full platform build for the updated commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref fix/title-menu-font-labels
